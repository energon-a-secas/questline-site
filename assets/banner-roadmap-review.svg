<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <defs>
    <!-- Gold milestone: navy base warming to a gold horizon on the right. -->
    <linearGradient id="rm-base" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#0a1422"/>
      <stop offset="0.6" stop-color="#13182a"/>
      <stop offset="1" stop-color="#2a2410"/>
    </linearGradient>
    <radialGradient id="rm-sun" cx="0.85" cy="0.85" r="0.7">
      <stop offset="0" stop-color="#ffce4d" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#ffce4d" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffce4d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rm-cool" cx="0.1" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#2aa8ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2aa8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rm-flag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffce4d" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#ffce4d" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="480" fill="#0a1424"/>
  <rect width="1200" height="480" fill="url(#rm-base)"/>
  <rect width="1200" height="480" fill="url(#rm-cool)"/>
  <rect width="1200" height="480" fill="url(#rm-sun)"/>
  <!-- A milestone ridge: stepped gold horizon line climbing to the right. -->
  <g stroke="url(#rm-flag)" stroke-width="1.6" fill="none" opacity="0.85">
    <path d="M620 410 L760 410 L760 330 L900 330 L900 240 L1040 240 L1040 150 L1200 150"/>
  </g>
  <g fill="#ffce4d">
    <rect x="755" y="322" width="10" height="10" transform="rotate(45 760 327)" opacity="0.8"/>
    <rect x="895" y="232" width="10" height="10" transform="rotate(45 900 237)" opacity="0.85"/>
    <rect x="1035" y="142" width="10" height="10" transform="rotate(45 1040 147)" opacity="0.9"/>
  </g>
  <!-- Soft gold orb on the horizon. -->
  <circle cx="1010" cy="360" r="120" fill="#ffce4d" opacity="0.08"/>
  <circle cx="1010" cy="360" r="70" fill="#ffce4d" opacity="0.07"/>
  <path d="M1200 0 L1200 480 L860 480 Z" fill="#ffce4d" opacity="0.05"/>
</svg>
