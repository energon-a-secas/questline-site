<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <defs>
    <!-- Violet orientation: navy base with a violet nebula on the right. -->
    <linearGradient id="wc-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1322"/>
      <stop offset="0.6" stop-color="#141232"/>
      <stop offset="1" stop-color="#221a3e"/>
    </linearGradient>
    <radialGradient id="wc-neb" cx="0.8" cy="0.25" r="0.85">
      <stop offset="0" stop-color="#b08cff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#8a6cff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#8a6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wc-cyan" cx="0.18" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#2aa8ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2aa8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wc-orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8b0ff" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#c8b0ff" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="480" fill="#0a1424"/>
  <rect width="1200" height="480" fill="url(#wc-base)"/>
  <rect width="1200" height="480" fill="url(#wc-cyan)"/>
  <rect width="1200" height="480" fill="url(#wc-neb)"/>
  <!-- Concentric orbit arcs: change radiating outward, weighted right. -->
  <g stroke="url(#wc-orbit)" stroke-width="1.4" fill="none" opacity="0.8">
    <circle cx="980" cy="170" r="90"/>
    <circle cx="980" cy="170" r="150"/>
    <circle cx="980" cy="170" r="220"/>
  </g>
  <g fill="#c8b0ff">
    <circle cx="980" cy="170" r="6" opacity="0.9"/>
    <circle cx="1070" cy="170" r="3.5" opacity="0.8"/>
    <circle cx="980" cy="20" r="3" opacity="0.7"/>
    <circle cx="830" cy="250" r="2.5" opacity="0.6"/>
    <circle cx="1140" cy="300" r="2.5" opacity="0.6"/>
  </g>
  <path d="M1200 0 L1200 480 L840 480 Z" fill="#b08cff" opacity="0.06"/>
</svg>
